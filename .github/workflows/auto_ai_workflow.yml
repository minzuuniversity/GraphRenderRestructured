name: 🧠 自动 编译测试 生成静态网页并发布到 gh-pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-ai-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: ⚙️ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💡 安装 Pandoc、Doxygen、Graphviz、Python3 + pip + jinja2
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc doxygen graphviz python3 python3-pip xvfb
          python3 -m pip install --upgrade pip
          pip3 install jinja2 beautifulsoup4 lxml

      - name: 🚀 编译、测试、生成报告并渲染发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x publish.sh
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x16" ./publish.sh

      - name: 📦 上传 AI 分析报告（如果存在）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-fix-report
          path: doc/ai_fix_suggestions.md
